name: localhunter
description: LocalHunter - prospection locale B2B pour agences web et freelances.
publish_to: 'none'
version: 2.2.0+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.9.0
  csv: ^6.0.0
  excel: ^4.0.6
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  flutter_dotenv: ^5.2.1
  in_app_purchase: ^3.2.3
  shared_preferences: ^2.5.5
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/LogoLocalHunt.png
  web:
    generate: true
    image_path: assets/LogoLocalHunt.png
    background_color: "#0175C2"
    theme_color: "#0175C2"
  windows:
    generate: true
    image_path: assets/LogoLocalHunt.png
  macos:
    generate: true
    image_path: assets/LogoLocalHunt.png
  linux:
    generate: true
    image_path: assets/LogoLocalHunt.png
